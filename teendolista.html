<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teendőlista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="todo-card">
    <h1>Teendőlista</h1>
    <div class="counter" id="counter"></div>

    <div class="input-group mb-4">
      <input type="text" id="taskInput" class="form-control" placeholder="Mi a következő feladat?" maxlength="120">
      <button class="btn btn-add" id="addBtn">Hozzáadás</button>
    </div>

    <div id="list"></div>
  </div>

  <script>
    const KEY = "teendok";
    const input = document.getElementById("taskInput");
    const list = document.getElementById("list");
    const counter = document.getElementById("counter");

    // Betöltés LocalStorage-ból
    let tasks = [];
    try {
      tasks = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch (e) {
      tasks = [];
    }

    // Mentés LocalStorage-ba
    function save() {
      localStorage.setItem(KEY, JSON.stringify(tasks));
    }

    // Új feladat hozzáadása
    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      save();
      render();
    }

    // Kész állapot váltása
    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    // Feladat törlése
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    // Kirajzolás
    function render() {
      list.innerHTML = "";

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">Még nincs feladat. Írj be egyet fent!</div>';
      }

      tasks.forEach(t => {
        const item = document.createElement("div");
        item.className = "todo-item" + (t.done ? " done" : "");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = t.done;
        cb.addEventListener("change", () => toggleTask(t.id));

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = t.text;

        const del = document.createElement("button");
        del.className = "btn-del";
        del.innerHTML = "&times;";
        del.title = "Törlés";
        del.addEventListener("click", () => deleteTask(t.id));

        item.append(cb, span, del);
        list.appendChild(item);
      });

      const done = tasks.filter(t => t.done).length;
      counter.textContent = tasks.length
        ? done + " / " + tasks.length + " kész"
        : "";
    }

    document.getElementById("addBtn").addEventListener("click", addTask);
    input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

    render();
  </script>
</body>
</html>
