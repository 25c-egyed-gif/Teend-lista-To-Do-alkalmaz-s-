<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teendőlista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f0fe 0%, #f3e8ff 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 40px 12px;
    }
    .todo-card {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(60, 60, 120, .15);
      padding: 28px;
    }
    h1 { font-size: 1.7rem; font-weight: 700; color: #3b3f6b; margin-bottom: 4px; }
    .counter { color: #8a8fb3; font-size: .9rem; margin-bottom: 20px; }
    .btn-add { background: #6c63ff; border: none; color: #fff; padding: 0 22px; }
    .btn-add:hover { background: #574fe0; color: #fff; }
    .form-control:focus { border-color: #6c63ff; box-shadow: 0 0 0 .2rem rgba(108, 99, 255, .2); }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #f7f8fc;
      border-radius: 12px;
      transition: background .2s;
    }
    .todo-item:hover { background: #eef0fa; }
    .todo-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #6c63ff; }
    .todo-text { flex: 1; word-break: break-word; color: #333; }
    .todo-item.done .todo-text { text-decoration: line-through; color: #aab; }
    .btn-del { border: none; background: transparent; color: #d9534f; font-size: 1.2rem; line-height: 1; }
    .btn-del:hover { color: #a02622; }
    .empty { text-align: center; color: #aab; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="todo-card">
    <h1>Teendőlista</h1>
    <div class="counter" id="counter"></div>

    <div class="input-group mb-4">
      <input type="text" id="taskInput" class="form-control" placeholder="Mi a következő feladat?" maxlength="120">
      <button class="btn btn-add" id="addBtn">Hozzáadás</button>
    </div>

    <div id="list"></div>
  </div>

  <script>
    const KEY = "teendok";
    const input = document.getElementById("taskInput");
    const list = document.getElementById("list");
    const counter = document.getElementById("counter");

    // Betöltés LocalStorage-ból
    let tasks = [];
    try {
      tasks = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch (e) {
      tasks = [];
    }

    // Mentés LocalStorage-ba
    function save() {
      localStorage.setItem(KEY, JSON.stringify(tasks));
    }

    // Új feladat hozzáadása
    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      save();
      render();
    }

    // Kész állapot váltása
    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    // Feladat törlése
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    // Kirajzolás
    function render() {
      list.innerHTML = "";

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">Még nincs feladat. Írj be egyet fent!</div>';
      }

      tasks.forEach(t => {
        const item = document.createElement("div");
        item.className = "todo-item" + (t.done ? " done" : "");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = t.done;
        cb.addEventListener("change", () => toggleTask(t.id));

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = t.text;

        const del = document.createElement("button");
        del.className = "btn-del";
        del.innerHTML = "&times;";
        del.title = "Törlés";
        del.addEventListener("click", () => deleteTask(t.id));

        item.append(cb, span, del);
        list.appendChild(item);
      });

      const done = tasks.filter(t => t.done).length;
      counter.textContent = tasks.length
        ? done + " / " + tasks.length + " kész"
        : "";
    }

    document.getElementById("addBtn").addEventListener("click", addTask);
    input.addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

    render();
  </script>
</body>
</html>
